name: Build Studio Assets

on:
  push:
    branches:
      - feat/blender-studio-assets
    paths:
      - "apps/stl-service/tools/export_studio_stls.py"
      - "apps/stl-service/tools/blender_render_product.py"
      - "apps/stl-service/tools/convert_studio_webp.py"
      - ".github/workflows/build-studio-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/stl-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Export Engineering STL set
        env:
          PYTHONPATH: .
        run: |
          rm -rf /tmp/teknovashop-stls
          python tools/export_studio_stls.py --output /tmp/teknovashop-stls --stage engineering

      - name: Render Studio assets
        run: |
          mkdir -p static/studio/engineering
          rm -f static/studio/engineering/*.png
          for stl in /tmp/teknovashop-stls/*.stl; do
            slug="$(basename "$stl" .stl)"
            png="static/studio/engineering/$slug.png"
            webp="static/studio/engineering/$slug.webp"
            blender -b --python tools/blender_render_product.py -- "$stl" "$png"
            python tools/convert_studio_webp.py "$png" "$webp"
            rm -f "$png"
          done

      - name: Verify 54 Studio assets
        run: |
          count="$(find static/studio/engineering -maxdepth 1 -name '*.webp' | wc -l)"
          echo "Rendered $count assets"
          test "$count" -eq 54

      - name: Commit generated assets
        working-directory: .
        run: |
          git config user.name "teknovashop-studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add apps/stl-service/static/studio/engineering
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Generate 54 canonical Studio assets [skip ci]"
          git push origin HEAD:feat/blender-studio-assets
