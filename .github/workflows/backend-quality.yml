name: Backend Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/stl-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/stl-service/requirements.txt

      - name: Install Forge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<9"
          pip check

      - name: Forge regression suite
        env:
          PYTHONPATH: .
        run: pytest -q tests

  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/cad-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/cad-service/requirements.txt

      - name: Install CAD
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<9"
          pip check

      - name: CAD kernel suite
        env:
          PYTHONPATH: .
        run: pytest -q tests

  backend-quality:
    if: always()
    needs: [forge, cad]
    runs-on: ubuntu-latest
    steps:
      - name: Require both engines
        env:
          FORGE_RESULT: ${{ needs.forge.result }}
          CAD_RESULT: ${{ needs.cad.result }}
        run: |
          echo "Forge: $FORGE_RESULT"
          echo "CAD:   $CAD_RESULT"
          test "$FORGE_RESULT" = "success"
          test "$CAD_RESULT" = "success"
