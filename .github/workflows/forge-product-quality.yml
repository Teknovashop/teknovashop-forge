name: Forge Product Quality

on:
  push:
    branches: [main]
    paths:
      - "apps/stl-service/**"
      - ".github/workflows/forge-product-quality.yml"
  pull_request:
    paths:
      - "apps/stl-service/**"
      - ".github/workflows/forge-product-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/stl-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/stl-service/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libglu1-mesa libopengl0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<9"
          pip check

      - name: Run 18-product quality gate
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_product_contracts.py
