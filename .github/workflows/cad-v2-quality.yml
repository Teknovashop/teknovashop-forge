name: CAD V2 Quality

on:
  push:
    branches: [main]
    paths:
      - "apps/cad-service/**"
      - ".github/workflows/cad-v2-quality.yml"
  pull_request:
    paths:
      - "apps/cad-service/**"
      - ".github/workflows/cad-v2-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-v2-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cad-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/cad-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/cad-service/requirements.txt

      - name: Install CAD service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<9"
          pip check

      - name: CAD kernel tests
        run: pytest -q tests
